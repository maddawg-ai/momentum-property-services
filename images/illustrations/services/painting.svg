<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img"><defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#eaf3ec"/><stop offset="1" stop-color="#f7faf6"/>
  </linearGradient>
  <linearGradient id="skyWarm" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fdf3dc"/><stop offset="1" stop-color="#f7faf6"/>
  </linearGradient>
  <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#084f2b"/><stop offset="1" stop-color="#0b6b3a"/>
  </linearGradient>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef3ee"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d8c3a1"/><stop offset="1" stop-color="#c2a883"/>
  </linearGradient>
  <linearGradient id="turf" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2f8f52"/><stop offset="1" stop-color="#084f2b"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#cfe6f2"/><stop offset="1" stop-color="#9fc6da"/>
  </linearGradient>
  <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#f2a900"/>
  </linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0e1a14" flood-opacity=".18"/>
  </filter>
  <filter id="tight" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0e1a14" flood-opacity=".22"/>
  </filter>
  
</defs><rect width="800" height="500" fill="#cfd8d1"/>
  <!-- half-painted wall reveal -->
  <rect width="800" height="390.0" fill="#d9d2c4"/>
  <path d="M0 0 h430 v390.0 H0Z" fill="#efe6d6"/>
  <path d="M430 0 v390.0" stroke="#ffffff" stroke-width="6"/>
  <!-- crown molding + trim -->
  <rect width="800" height="26" fill="#ffffff"/>
  <rect y="376.0" width="800" height="14" fill="#ffffff"/>
  <rect y="390.0" width="800" height="110.0" fill="url(#floor)"/>
  <!-- drop cloth -->
  <path d="M60 390.0 h520 l40 110.0 H20Z" fill="#f7faf6" opacity=".95"/>
  <!-- window -->
  <rect x="600" y="70" width="150" height="180" rx="6" fill="url(#glass)" opacity=".9"/>
  <path d="M600 70h150v180H600z" fill="none" stroke="#ffffff" stroke-width="10"/>
  <path d="M675 70v180" stroke="#ffffff" stroke-width="7"/>
  <!-- ladder -->
  <g filter="url(#tight)">
    <path d="M118 120 L96 392 M186 120 L208 392" stroke="#c08a3e" stroke-width="12" stroke-linecap="round"/>
    <path d="M124 190h56M118 250h68M112 312h80" stroke="#a8752f" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- roller + tray -->
  <g filter="url(#tight)">
    <path d="M470 214 L446 300" stroke="#0e1a14" stroke-width="10" stroke-linecap="round"/>
    <rect x="440" y="176" width="82" height="34" rx="16" fill="#bfe6cd"/>
    <rect x="452" y="184" width="58" height="18" rx="9" fill="#ffffff" opacity=".65"/>
    <rect x="596" y="360" width="130" height="30" rx="8" fill="#0e1a14" opacity=".8"/>
    <rect x="606" y="366" width="110" height="16" rx="6" fill="#0b6b3a"/>
  </g>
  <!-- paint swatches -->
  <g filter="url(#tight)">
    <rect x="700" y="300" width="34" height="46" rx="5" fill="#0b6b3a"/>
    <rect x="740" y="300" width="34" height="46" rx="5" fill="#f2a900"/>
  </g>
  <g filter="url(#tight)">
  <ellipse cx="330" cy="434" rx="57.78" ry="7" fill="#0e1a14" opacity=".16"/>
  <rect x="317.16" y="357.24" width="10.914000000000001" height="72.76" rx="7" fill="#2f3a33"/>
  <rect x="331.926" y="357.24" width="10.914000000000001" height="72.76" rx="7" fill="#3a463f"/>
  <path d="M300.468 280.20000000000005 q29.532000000000004 -12.84 59.06400000000001 0 l3.852 85.60000000000001 q-33.384 14.980000000000002 -66.768 0 Z"
        fill="url(#deep)"/>
  <path d="M359.532 301.6 q28 -21.400000000000002 34 -47.08" stroke="#0b6b3a" stroke-width="18.19" stroke-linecap="round" fill="none"/>
  <circle cx="330" cy="261.10050000000007" r="22.47" fill="#e8b98f"/>
  <path d="M307.53 254.35950000000005 q22.47 -19.0995 44.94 0 q-22.47 -11.235 -44.94 0Z" fill="#0e1a14" opacity=".8"/>
</g></svg>