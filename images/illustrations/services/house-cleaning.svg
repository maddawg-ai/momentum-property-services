<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img"><defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#eaf3ec"/><stop offset="1" stop-color="#f7faf6"/>
  </linearGradient>
  <linearGradient id="skyWarm" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fdf3dc"/><stop offset="1" stop-color="#f7faf6"/>
  </linearGradient>
  <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#084f2b"/><stop offset="1" stop-color="#0b6b3a"/>
  </linearGradient>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef3ee"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d8c3a1"/><stop offset="1" stop-color="#c2a883"/>
  </linearGradient>
  <linearGradient id="turf" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2f8f52"/><stop offset="1" stop-color="#084f2b"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#cfe6f2"/><stop offset="1" stop-color="#9fc6da"/>
  </linearGradient>
  <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#f2a900"/>
  </linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0e1a14" flood-opacity=".18"/>
  </filter>
  <filter id="tight" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0e1a14" flood-opacity=".22"/>
  </filter>
  
</defs><rect width="800" height="500" fill="url(#wall)"/>
  <rect y="350.0" width="800" height="150.0" fill="url(#floor)"/>
  <!-- window light -->
  <rect x="70" y="70" width="180" height="150" rx="8" fill="url(#glass)" opacity=".85"/>
  <path d="M70 70h180v150H70z" fill="none" stroke="#ffffff" stroke-width="10"/>
  <path d="M160 70v150M70 145h180" stroke="#ffffff" stroke-width="8"/>
  <path d="M250 90 L470 300 L250 300Z" fill="#ffd166" opacity=".14"/>
  <!-- upper cabinets -->
  <rect x="470" y="60" width="290" height="120" rx="8" fill="#ffffff" filter="url(#soft)"/>
  <path d="M615 60v120" stroke="#cfd8d1" stroke-width="4"/>
  <!-- counter + base cabinets -->
  <rect x="360" y="330" width="400" height="22" rx="6" fill="#cfd8d1"/>
  <rect x="360" y="352" width="400" height="-2.0" fill="#ffffff"/>
  <path d="M560 352v-2.0" stroke="#cfd8d1" stroke-width="4"/>
  <!-- island -->
  <g filter="url(#soft)">
    <rect x="150" y="330" width="230" height="20" rx="6" fill="#eef2ee"/>
    <rect x="165" y="350" width="200" height="100" rx="4" fill="#084f2b"/>
  </g>
  <!-- bowl of lemons -->
  <ellipse cx="243" cy="322" rx="34" ry="11" fill="#bfe6cd"/>
  <circle cx="232" cy="315" r="9" fill="#f2a900"/><circle cx="250" cy="313" r="9" fill="#ffd166"/>
  <!-- spray bottle + cloth on counter -->
  <g filter="url(#tight)">
    <rect x="620" y="286" width="30" height="44" rx="7" fill="#0b6b3a"/>
    <rect x="628" y="272" width="14" height="16" rx="4" fill="#0e1a14"/>
    <path d="M628 278 L604 264" stroke="#0e1a14" stroke-width="6" stroke-linecap="round"/>
    <rect x="676" y="312" width="58" height="18" rx="9" fill="#f2a900"/>
  </g>
  <g filter="url(#tight)">
  <ellipse cx="470" cy="474" rx="56.7" ry="7" fill="#0e1a14" opacity=".16"/>
  <rect x="457.4" y="398.6" width="10.71" height="71.4" rx="7" fill="#2f3a33"/>
  <rect x="471.89" y="398.6" width="10.71" height="71.4" rx="7" fill="#3a463f"/>
  <path d="M441.02 323.0 q28.98 -12.6 57.96 0 l3.78 84.0 q-32.76 14.700000000000001 -65.52 0 Z"
        fill="url(#deep)"/>
  <path d="M498.98 344.0 q34 12.6 44 42.0" stroke="#0b6b3a" stroke-width="17.85" stroke-linecap="round" fill="none"/>
  <circle cx="470" cy="304.2575" r="22.05" fill="#e8b98f"/>
  <path d="M447.95 297.6425 q22.05 -18.7425 44.1 0 q-22.05 -11.025 -44.1 0Z" fill="#0e1a14" opacity=".8"/>
</g>
  <path d="M700 237Q702.86 247.14 713 250Q702.86 252.86 700 263Q697.14 252.86 687 250Q697.14 247.14 700 237Z" fill="#f2a900" opacity=".95"/><path d="M730 278Q731.76 284.24 738 286Q731.76 287.76 730 294Q728.24 287.76 722 286Q728.24 284.24 730 278Z" fill="#f2a900" opacity=".95"/><path d="M672 203Q673.98 210.02 681 212Q673.98 213.98 672 221Q670.02 213.98 663 212Q670.02 210.02 672 203Z" fill="#f2a900" opacity=".95"/>
  <path d="M300 290Q302.2 297.8 310 300Q302.2 302.2 300 310Q297.8 302.2 290 300Q297.8 297.8 300 290Z" fill="#ffd166" opacity=".95"/></svg>